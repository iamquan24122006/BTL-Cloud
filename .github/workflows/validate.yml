name: Validate repository (no AWS deployment)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m src.moodle_cloud validate
      - run: python -m src.moodle_cloud --config config/medium.example.yaml validate
      - run: python -m scripts.medium_bundle
      - run: python -m scripts.manual_bundle
      - run: |
          for script in scripts/*.sh scripts/medium/*.sh .work/manual-transfer.sh; do
            bash -n "$script"
          done
      - name: Build and smoke-test the pinned PHP/Apache runtime
        run: python -m scripts.check_runtime --image moodle-php:ci
      - name: Lint administrator rotation acceptance
        run: docker run --rm --network none --entrypoint php --mount "type=bind,src=$PWD/tests/integration,dst=/checks,readonly" moodle-php:ci -l /checks/rotate_admin.php
      - name: Save runtime check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-check
          path: .work/runtime-check/
          if-no-files-found: ignore
          retention-days: 7
      - name: Install Moodle and verify a local backup/restore round trip
        timeout-minutes: 35
        run: python -m scripts.check_moodle --image moodle-php:ci
      - name: Save Moodle integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moodle-check
          path: .work/moodle-check/
          if-no-files-found: ignore
          retention-days: 7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/small init -backend=false -input=false
      - run: terraform -chdir=infra/small validate
      - run: terraform -chdir=infra/small test
      - run: terraform -chdir=infra/small_public init -backend=false -input=false
      - run: terraform -chdir=infra/small_public validate
      - run: terraform -chdir=infra/backup init -backend=false -input=false
      - run: terraform -chdir=infra/backup validate
      - run: terraform -chdir=infra/backup test
      - run: terraform -chdir=infra/budget init -backend=false -input=false
      - run: terraform -chdir=infra/budget validate
      - run: terraform -chdir=infra/budget test
      - run: terraform -chdir=tests/load/infra fmt -check -recursive
      - run: terraform -chdir=tests/load/infra init -backend=false -input=false
      - run: terraform -chdir=tests/load/infra validate
      - run: terraform -chdir=tests/load/infra test
      - run: terraform -chdir=infra/medium init -backend=false -input=false
      - run: terraform -chdir=infra/medium validate
      - run: terraform -chdir=infra/medium test
      - run: terraform -chdir=infra/backend init -backend=false -input=false
      - run: terraform -chdir=infra/backend validate
      - name: Validate isolated medium support and AMI builder roots
        run: |
          for root in infra/medium_support infra/medium_builder; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
      - name: Build medium validation image (never published)
        run: >-
          docker build --platform linux/amd64 --file scripts/medium/Dockerfile
          --build-arg RELEASE_COMMIT=0000000000000000000000000000000000000000
          --build-arg MOODLE_COMMIT=215f44380bdc3ccf852a3a22e34f8423ff64033a
          --tag moodle-medium:ci .
      - run: python -m scripts.check_medium_runtime --image moodle-medium:ci
      - name: Save medium check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medium-runtime-check
          path: |
            .work/medium-runtime-check/report.json
            .work/medium-runtime-check/*.log
          if-no-files-found: ignore
          retention-days: 7
