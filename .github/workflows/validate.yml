name: Validate repository (no AWS deployment)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m src.moodle_cloud validate
      - run: python -m scripts.manual_bundle
      - run: |
          for script in scripts/*.sh .work/manual-transfer.sh; do
            bash -n "$script"
          done
      - name: Build and smoke-test the pinned PHP/Apache runtime
        run: python -m scripts.check_runtime --image moodle-php:ci
      - name: Save runtime check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-check
          path: .work/runtime-check/
          if-no-files-found: ignore
          retention-days: 7
      - name: Install Moodle and verify a local backup/restore round trip
        timeout-minutes: 35
        run: python -m scripts.check_moodle --image moodle-php:ci
      - name: Save Moodle integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moodle-check
          path: .work/moodle-check/
          if-no-files-found: ignore
          retention-days: 7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/small init -backend=false -input=false
      - run: terraform -chdir=infra/small validate
      - run: terraform -chdir=infra/small test
      - run: terraform -chdir=infra/backup init -backend=false -input=false
      - run: terraform -chdir=infra/backup validate
      - run: terraform -chdir=infra/backup test
      - run: terraform -chdir=infra/budget init -backend=false -input=false
      - run: terraform -chdir=infra/budget validate
      - run: terraform -chdir=infra/budget test
      - run: terraform -chdir=tests/load/infra fmt -check -recursive
      - run: terraform -chdir=tests/load/infra init -backend=false -input=false
      - run: terraform -chdir=tests/load/infra validate
      - run: terraform -chdir=tests/load/infra test
