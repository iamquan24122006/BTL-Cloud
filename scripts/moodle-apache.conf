ServerName localhost
<VirtualHost 127.0.0.1:8080>
    ServerName localhost
    DocumentRoot /var/www/moodle
    DirectoryIndex index.php
    <Directory /var/www/moodle>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        AcceptPathInfo On
        Require local
    </Directory>
    <DirectoryMatch "(/\.git|/vendor|/node_modules|/tests)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^(config\.php|composer\.(json|lock)|README.*|UPGRADING.*)$">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
