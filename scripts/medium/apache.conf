<VirtualHost *:8080>
    DocumentRoot /var/www/moodle
    DirectoryIndex index.php
    LimitRequestBody 67108864
    ServerSignature Off
    <Directory /var/www/moodle>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        AcceptPathInfo On
    </Directory>
    <FilesMatch "^(config\.php|\..*)$">
        Require all denied
    </FilesMatch>
    Header always set Strict-Transport-Security "max-age=31536000"
    # Omit query strings, cookies, referers and user identifiers from access logs.
    LogFormat "%t %m %U %>s %D" medium
    CustomLog /proc/self/fd/1 medium
    ErrorLog /proc/self/fd/2
</VirtualHost>
